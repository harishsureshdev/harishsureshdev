<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Warden: every tool call passes a policy check in code. AUTO reads go to the GitHub API, APPROVE writes wait for a human, DENY actions are blocked."><rect x="1" y="1" width="858" height="298" rx="12" fill="#0d1117" stroke="#30363d"/><text x="24" y="34" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Inside Warden</text><text x="136" y="34" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">every tool call passes a policy check in code before it reaches GitHub</text><g stroke="#30363d" stroke-width="2" fill="none"><path d="M144 150 H194"/><path d="M344 150 H390"/><path d="M550 150 C582 150 582 64 612 64"/><path d="M550 150 C582 150 582 150 612 150"/><path d="M550 150 C582 150 582 236 612 236"/></g><rect x="24" y="120" width="120" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="84.0" y="147.0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">New issue</text><text x="84.0" y="165.0" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">GitHub repo</text><rect x="194" y="120" width="150" height="60" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/><text x="269.0" y="147.0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Agent loop</text><text x="269.0" y="165.0" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">Gemini · tool calls</text><rect x="390" y="114" width="160" height="72" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/><text x="470.0" y="147.0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Policy check</text><text x="470.0" y="165.0" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">in the dispatcher</text><rect x="612" y="37" width="226" height="54" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/><text x="725.0" y="61.0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">AUTO → GitHub API</text><text x="725.0" y="79.0" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">reads run immediately</text><rect x="612" y="123" width="226" height="54" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/><text x="725.0" y="147.0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">APPROVE → human</text><text x="725.0" y="165.0" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">writes wait for review</text><rect x="612" y="209" width="226" height="54" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/><text x="725.0" y="233.0" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">DENY → blocked</text><text x="725.0" y="251.0" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" text-anchor="middle">refusal goes back to the agent</text><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.32;0.34;1" dur="6s" begin="0s" repeatCount="indefinite"/><g stroke="#3fb950" stroke-width="2.5" fill="none" stroke-dasharray="6 6" stroke-linecap="round"><path d="M144 150 H194"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path><path d="M344 150 H390"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path><path d="M550 150 C582 150 582 64 612 64"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path></g><rect x="609" y="34" width="232" height="60" rx="12" fill="none" stroke="#3fb950" stroke-width="3" opacity="0.55"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.32;0.34;1" dur="6s" begin="2s" repeatCount="indefinite"/><g stroke="#d29922" stroke-width="2.5" fill="none" stroke-dasharray="6 6" stroke-linecap="round"><path d="M144 150 H194"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path><path d="M344 150 H390"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path><path d="M550 150 C582 150 582 150 612 150"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path></g><rect x="609" y="120" width="232" height="60" rx="12" fill="none" stroke="#d29922" stroke-width="3" opacity="0.55"/></g><g opacity="0"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.32;0.34;1" dur="6s" begin="4s" repeatCount="indefinite"/><g stroke="#f85149" stroke-width="2.5" fill="none" stroke-dasharray="6 6" stroke-linecap="round"><path d="M144 150 H194"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path><path d="M344 150 H390"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path><path d="M550 150 C582 150 582 236 612 236"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="0.6s" repeatCount="indefinite"/></path></g><rect x="609" y="206" width="232" height="60" rx="12" fill="none" stroke="#f85149" stroke-width="3" opacity="0.55"/></g><text x="24" y="280" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Blocked 12/12 unsafe or injected actions across 3 runs (3–5/12 with prompt-only rules) · 40-scenario eval gates every push, 39–40/40 passing</text></svg>